<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MECH1560 – Major Project Gantt Chart</title>

<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

body{
  font-family:Segoe UI,system-ui,sans-serif;
  background:#f5f4f0;
  color:#1a1a18;
  padding:2rem;
}

.page{
  max-width:960px;
  margin:auto;
  background:#fff;
  border:1px solid #e0dfd8;
  border-radius:12px;
  overflow:hidden;
}

.page-header{
  padding:1.5rem 2rem;
  border-bottom:1px solid #e0dfd8;
}

.page-header h1{
  font-size:18px;
  font-weight:700;
}

.page-header p{
  font-size:12px;
  color:#777;
  margin-top:4px;
}

.gantt-wrap{
  padding:2rem;
}

.task-row{
  display:flex;
  align-items:center;
  margin-bottom:10px;
}

.task-label{
  width:260px;
  font-size:13px;
  padding-right:12px;
}

.task-bar{
  flex:1;
  min-height:34px;
  background:#378ADD;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 10px;
  color:white;
  gap:10px;
}

.badge{
  background:rgba(0,0,0,0.25);
  padding:3px 8px;
  border-radius:999px;
  font-size:11px;
}

.btn{
  border:none;
  background:#1a1a18;
  color:white;
  border-radius:7px;
  padding:5px 10px;
  cursor:pointer;
  font-size:12px;
}

.btn:hover{
  opacity:0.9;
}

.footer{
  padding:1rem 2rem;
  border-top:1px solid #e0dfd8;
  font-size:12px;
  color:#666;
}
</style>
</head>

<body>

<div class="page">

  <div class="page-header">
    <h1>MECH1560 – Shared Team Planner</h1>
    <p>Assignments sync live with Firebase</p>
  </div>

  <div class="gantt-wrap" id="tasks"></div>

  <div class="footer">
    Open this page on any computer. Changes sync automatically.
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  setDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyAHCIq8BltUh3dupeL9fhe1Ou3jw7PsjDg",
  authDomain: "mech1560-planner.firebaseapp.com",
  projectId: "mech1560-planner",
  storageBucket: "mech1560-planner.firebasestorage.app",
  messagingSenderId: "992164236631",
  appId: "1:992164236631:web:d02666d1cd02dda778c212"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const ref = doc(db, "projects", "mech1560");


const TASKS = [
  { id:"t1", label:"Finalise design & materials list" },
  { id:"t2", label:"Source & purchase materials" },
  { id:"t3", label:"Build device" },
  { id:"t4", label:"Test & calibrate device" },
  { id:"t5", label:"Final prep & run-day readiness" },
  { id:"r1", label:"Revise prelim report sections" },
  { id:"r2", label:"Engineering analysis" },
  { id:"r3", label:"Technical drawings" },
  { id:"r4", label:"Material selection writeup" },
  { id:"r5", label:"Construction/results section" },
  { id:"p1", label:"Slides content & structure" },
  { id:"p2", label:"Build slides" },
  { id:"p3", label:"Rehearsal" }
];

let assignments = {};

function render(){

  const wrap = document.getElementById("tasks");

  wrap.innerHTML = TASKS.map(task => `
    <div class="task-row">
      <div class="task-label">${task.label}</div>

      <div class="task-bar">
        <span class="badge">
          ${assignments[task.id] || "Unassigned"}
        </span>

        <button class="btn" onclick="assignTask('${task.id}')">
          Assign
        </button>
      </div>
    </div>
  `).join("");
}

window.assignTask = async function(id){

  const current = assignments[id] || "";
  const name = prompt("Assign team member:", current);

  if(name === null) return;

  if(name.trim() === ""){
    delete assignments[id];
  } else {
    assignments[id] = name.trim();
  }

  await setDoc(ref, { assignments });
};

onSnapshot(ref, (snap) => {

  if(snap.exists()){
    assignments = snap.data().assignments || {};
  } else {
    assignments = {};
  }

  render();
});

render();

</script>

</body>
</html>
