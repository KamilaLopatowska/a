<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MECH1560 – Major Project Gantt Chart</title>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #f5f4f0;
    color: #1a1a18;
    min-height: 100vh;
    padding: 2rem;
  }

  .page {
    max-width: 960px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 12px;
    border: 1px solid #e0dfd8;
    overflow: hidden;
  }

  .page-header {
    padding: 1.5rem 2rem 1.25rem;
    border-bottom: 1px solid #e0dfd8;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .page-header-left h1 {
    font-size: 17px;
    font-weight: 600;
  }

  .page-header-left p {
    font-size: 12px;
    color: #7a796f;
    margin-top: 3px;
  }

  .btn {
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    border-radius: 7px;
    border: 1px solid #d0cfc8;
    background: #ffffff;
    padding: 6px 14px;
    cursor: pointer;
  }

  .btn.primary {
    background: #1a1a18;
    color: white;
    border-color: #1a1a18;
  }

  .gantt-wrap { padding: 1.5rem 2rem 2rem; }

  .legend {
    display: flex;
    gap: 20px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #4a4a46;
  }

  .legend-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
  }

  .gantt-header-row {
    display: flex;
    margin-bottom: 4px;
  }

  .label-col { width: 200px; flex-shrink: 0; }

  .weeks-area {
    flex: 1;
    display: flex;
    border-bottom: 1px solid #e0dfd8;
  }

  .week-col {
    flex: 1;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: #7a796f;
    padding-bottom: 5px;
  }

  .week-col.now { color: #185FA5; }

  .milestones-row {
    display: flex;
    margin-bottom: 14px;
  }

  .milestones-label {
    width: 200px;
    font-size: 10px;
    color: #7a796f;
    padding-top: 3px;
    text-transform: uppercase;
  }

  .milestones-grid {
    flex: 1;
    position: relative;
    height: 42px;
  }

  .vline {
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background: #ebe9e2;
  }

  .milestone {
    position: absolute;
    transform: translateX(-50%);
    text-align: center;
  }

  .milestone-diamond {
    width: 9px; height: 9px;
    background: #D85A30;
    transform: rotate(45deg);
    margin: auto;
  }

  .milestone-label {
    font-size: 8.5px;
    color: #D85A30;
  }

  .track-header {
    display: flex;
    align-items: center;
    gap: 7px;
    margin: 14px 0 6px;
  }

  .track-dot { width: 8px; height: 8px; border-radius: 50%; }

  .track-name { font-size: 11.5px; font-weight: 600; }

  .track-line {
    flex: 1;
    height: 1px;
    background: #ebe9e2;
  }

  .task-row {
    display: flex;
    align-items: center;
    margin-bottom: 4px;
  }

  .task-label {
    width: 200px;
    font-size: 11px;
    color: #4a4a46;
    padding-right: 12px;
  }

  .task-grid {
    flex: 1;
    position: relative;
    height: 28px;
  }

  .task-bar {
    position: absolute;
    height: 20px;
    top: 4px;
    border-radius: 5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    padding: 0 8px;
  }

  .assignee-pill {
    font-size: 9px;
    color: white;
    background: rgba(0,0,0,0.25);
    border-radius: 8px;
    padding: 1px 6px;
    display: none;
  }
</style>
</head>

<body>

<div class="page">

  <div class="page-header">
    <div class="page-header-left">
      <h1>MECH1560 – Major Project Plan</h1>
      <p>Firebase synced version</p>
    </div>
    <div>
      <button class="btn" onclick="window.print()">Print</button>
    </div>
  </div>

  <div class="gantt-wrap">

    <div id="tracks"></div>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAHCIq8BltUh3dupeL9fhe1Ou3jw7PsjDg",
  authDomain: "mech1560-planner.firebaseapp.com",
  projectId: "mech1560-planner",
  storageBucket: "mech1560-planner.firebasestorage.app",
  messagingSenderId: "992164236631",
  appId: "1:992164236631:web:d02666d1cd02dda778c212"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const ref = doc(db, "projects", "mech1560");

const WK_START = 9, WK_SPAN = 5;

const TRACKS = [
  { id:'build', name:'Device Build', color:'#1D9E75' },
  { id:'report', name:'Final Report', color:'#378ADD' },
  { id:'pres', color:'#BA7517', name:'Presentation' }
];

const TASKS = [
  { id:'t1', label:'Design & materials', start:9, end:10, track:'build' },
  { id:'t2', label:'Purchase materials', start:9.5, end:11, track:'build' },
  { id:'t3', label:'Build device', start:10, end:12, track:'build' },

  { id:'r1', label:'Report writing', start:9, end:12, track:'report' },
  { id:'p1', label:'Slides & rehearsal', start:10, end:12, track:'pres' }
];

let assignments = {};

const p = w => (((w-WK_START)/WK_SPAN)*100) + '%';
const pw = (s,e)=>(((e-s)/WK_SPAN)*100) + '%';

function render(){

  const container = document.getElementById("tracks");

  container.innerHTML = TRACKS.map(track => {

    const tasks = TASKS.filter(t => t.track === track.id);

    return `
      <div class="track-header">
        <div class="track-dot" style="background:${track.color}"></div>
        <div class="track-name">${track.name}</div>
        <div class="track-line"></div>
      </div>

      ${tasks.map(task => `
        <div class="task-row">
          <div class="task-label">${task.label}</div>
          <div class="task-grid">

            <div class="task-bar"
              style="left:${p(task.start)};width:${pw(task.start,task.end)};background:${track.color}"
              onclick="assign('${task.id}')">

              <span class="assignee-pill" id="a-${task.id}">
                ${assignments[task.id] || ""}
              </span>

            </div>

          </div>
        </div>
      `).join("")}

    `;
  }).join("");

  Object.keys(assignments).forEach(id => {
    const el = document.getElementById("a-"+id);
    if(el){
      el.style.display = "block";
      el.textContent = assignments[id];
    }
  });
}

window.assign = async function(id){

  const name = prompt("Assign:", assignments[id] || "");

  if(name === null) return;

  if(name.trim() === ""){
    delete assignments[id];
  } else {
    assignments[id] = name.trim();
  }

  await setDoc(ref, { assignments });
};

onSnapshot(ref, snap => {
  assignments = snap.exists() ? snap.data().assignments || {} : {};
  render();
});

render();

</script>

</body>
</html>
